<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J Petrol</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<nav>
<img src="images/logo.png" class="logo">
<ul>
<li data-key="home">الرئيسية</li>
<li data-key="services">الخدمات</li>
<li data-key="about">عن الخدمة</li>
<li data-key="contact">اتصل بنا</li>
</ul>
<button onclick="changeLang()">AR / EN</button>
</nav>
</header>

<section class="hero">
<div class="content">
<h1 data-key="heroTitle"></h1>
<p data-key="heroText"></p>
</div>
</section>

<section class="split">
<img src="images/quality.jpg">
<div>
<h2 data-key="whyTitle"></h2>
<p data-key="whyText"></p>
</div>
</section>

<section class="split dark">
<div>
<h2 data-key="expTitle"></h2>
<p data-key="expText"></p>
</div>
<img src="images/experience.jpg">
</section>

<section class="contact">
<img src="images/contact.jpg">
<h2 data-key="contactTitle"></h2>
<p data-key="contactText"></p>
</section>

<footer>
<h3>J Petrol</h3>
<p data-key="footer"></p>
</footer>

<script src="translations.js"></script>
<script>
let lang="ar";
function render(){
document.documentElement.lang=lang;
document.documentElement.dir=lang==="ar"?"rtl":"ltr";
document.querySelectorAll("[data-key]").forEach(e=>{
e.textContent=translations[lang][e.dataset.key];
});
}
function changeLang(){
lang=lang==="ar"?"en":"ar";
render();
}
render();
</script>
</body>
</html>
